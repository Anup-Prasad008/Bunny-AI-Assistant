<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050812" />
  <meta
    name="description"
    content="Bunny AI — a friendly, intelligent and interactive AI assistant."
  />
  <title>Bunny AI — Your Friendly AI Assistant</title>

  <style>
    :root {
      --bg-1: #050812;
      --bg-2: #091221;
      --bg-3: #0e1829;

      --panel: rgba(12, 21, 37, 0.76);
      --panel-strong: rgba(13, 23, 41, 0.94);

      --border: rgba(255, 255, 255, 0.09);

      --text: #f3f7ff;
      --text-soft: #a9b6cb;
      --text-muted: #6f7d93;

      --accent: #57d9c5;
      --accent-2: #36b7aa;
      --accent-glow: rgba(87, 217, 197, 0.20);

      --success: #69e6a7;
      --danger: #ff6f91;

      --shadow: 0 20px 60px rgba(0, 0, 0, 0.30);

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(87, 217, 197, 0.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 0%,
          rgba(54, 183, 170, 0.08),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          var(--bg-1),
          var(--bg-2) 48%,
          var(--bg-3)
        );
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      display: grid;
      grid-template-columns: 285px 1fr;
      width: 100%;
      height: 100%;
    }

    /* =========================
       SIDEBAR
    ========================== */

    .sidebar {
      position: relative;

      display: flex;
      flex-direction: column;
      gap: 10px;

      min-width: 0;

      padding: 16px 14px;

      background: rgba(7, 12, 23, 0.78);

      border-right: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 4px 7px 14px;

      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(87, 217, 197, 0.22),
          rgba(54, 183, 170, 0.10)
        );

      border: 1px solid rgba(87, 217, 197, 0.24);

      box-shadow: 0 0 28px var(--accent-glow);

      font-size: 19px;
    }

    .brand h1 {
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .brand span {
      display: block;

      color: var(--text-muted);

      font-size: 10px;

      margin-top: 2px;
    }

    .new-chat {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      width: 100%;

      min-height: 44px;

      margin-top: 5px;

      border-radius: 12px;

      color: #fff;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          rgba(87, 217, 197, 0.16),
          rgba(54, 183, 170, 0.10)
        );

      border: 1px solid rgba(87, 217, 197, 0.20);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .new-chat:hover {
      transform: translateY(-2px) scale(1.015);

      border-color: rgba(87, 217, 197, 0.48);

      box-shadow: 0 0 24px rgba(87, 217, 197, 0.12);
    }

    .sidebar-title {
      margin: 14px 6px 8px;

      color: var(--text-muted);

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 0.16em;
    }

    .chat-list {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding-right: 2px;
    }

    .chat-list::-webkit-scrollbar,
    .messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);

      border-radius: 20px;
    }

    .chat-item {
      position: relative;

      display: flex;
      align-items: center;

      gap: 10px;

      width: 100%;

      min-height: 44px;

      margin-bottom: 5px;

      padding: 0 11px;

      border-radius: 12px;

      color: var(--text-soft);

      background: transparent;

      text-align: left;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .chat-item:hover {
      color: #fff;

      transform: translateX(2px) scale(1.01);

      outline: 1px solid rgba(87, 217, 197, 0.32);

      outline-offset: -1px;
    }

    .chat-item.active {
      color: #fff;

      background: rgba(87, 217, 197, 0.07);

      outline: 1px solid rgba(87, 217, 197, 0.22);

      outline-offset: -1px;
    }

    .chat-icon {
      width: 27px;
      height: 27px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 8px;

      background: rgba(255, 255, 255, 0.045);

      color: var(--text-soft);

      font-size: 12px;
    }

    .chat-title {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 13px;
    }

    .side-actions {
      display: grid;
      gap: 5px;
    }

    .side-button {
      display: flex;
      align-items: center;

      gap: 10px;

      width: 100%;

      padding: 10px;

      border-radius: 11px;

      background: transparent;

      color: var(--text-soft);

      cursor: pointer;

      text-align: left;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .side-button:hover {
      color: #fff;

      transform: translateX(2px) scale(1.01);

      outline: 1px solid rgba(87, 217, 197, 0.28);

      outline-offset: -1px;
    }

    .side-button-icon {
      width: 26px;

      text-align: center;
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      position: relative;

      display: grid;

      grid-template-rows: auto 1fr auto;

      min-width: 0;

      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      min-height: 66px;

      padding: 0 22px;

      border-bottom: 1px solid var(--border);

      background: rgba(6, 10, 18, 0.52);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mobile-menu {
      display: none;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--success);

      box-shadow: 0 0 12px rgba(105, 230, 167, 0.7);
    }

    .topbar-title {
      font-size: 13px;

      color: var(--text-soft);
    }

    .topbar-badge {
      padding: 6px 9px;

      border-radius: 999px;

      background: rgba(87, 217, 197, 0.08);

      border: 1px solid rgba(87, 217, 197, 0.15);

      color: #bcefe7;

      font-size: 10px;
    }

    /* =========================
       MESSAGES
    ========================== */

    .messages {
      min-height: 0;

      overflow-y: auto;

      padding: 24px 20px 28px;

      scroll-behavior: smooth;
    }

    .messages-inner {
      width: min(900px, 100%);

      margin: 0 auto;
    }

    .welcome {
      width: min(820px, 100%);

      margin: 6vh auto 40px;

      text-align: center;

      animation: welcomeIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes welcomeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-logo {
      width: 88px;
      height: 88px;

      margin: 0 auto 20px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      background:
        radial-gradient(
          circle at 35% 25%,
          rgba(255, 255, 255, 0.16),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          rgba(87, 217, 197, 0.20),
          rgba(54, 183, 170, 0.10)
        );

      border: 1px solid rgba(87, 217, 197, 0.22);

      box-shadow:
        0 20px 60px rgba(87, 217, 197, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      animation: float 4s ease-in-out infinite;

      font-size: 42px;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    .welcome h2 {
      font-size: clamp(28px, 4vw, 46px);

      letter-spacing: -0.04em;

      line-height: 1.05;

      margin-bottom: 11px;

      background:
        linear-gradient(
          110deg,
          #fff 0%,
          #dffaf6 45%,
          #9be5dc 70%,
          #fff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      background-size: 220% auto;

      animation: gradientMove 6s linear infinite;
    }

    @keyframes gradientMove {
      to {
        background-position: 220% center;
      }
    }

    .welcome p {
      max-width: 620px;

      margin: 0 auto;

      color: var(--text-soft);

      font-size: 14px;

      line-height: 1.8;
    }

    .chips {
      margin-top: 24px;

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 9px;
    }

    .chip {
      padding: 9px 13px;

      border-radius: 999px;

      color: var(--text-soft);

      background: rgba(255, 255, 255, 0.035);

      border: 1px solid rgba(255, 255, 255, 0.07);

      cursor: pointer;

      font-size: 11px;

      transition:
        transform 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .chip:hover {
      color: #fff;

      transform: translateY(-2px) scale(1.02);

      border-color: rgba(87, 217, 197, 0.36);

      outline: 1px solid rgba(87, 217, 197, 0.22);

      outline-offset: -1px;
    }

    /* =========================
       CHAT BUBBLES
    ========================== */

    .message-wrap {
      display: flex;

      gap: 10px;

      align-items: flex-start;

      margin: 0 auto 18px;

      animation: messageIn 0.28s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-wrap.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: rgba(255, 255, 255, 0.045);

      border: 1px solid rgba(255, 255, 255, 0.07);

      font-size: 15px;
    }

    .message-content {
      max-width: min(770px, calc(100% - 50px));
    }

    .message-meta {
      margin-bottom: 6px;

      color: var(--text-muted);

      font-size: 10px;
    }

    .message-bubble {
      padding: 13px 15px;

      border-radius: 18px;

      line-height: 1.72;

      font-size: 14px;

      color: var(--text);

      border: 1px solid var(--border);

      background: rgba(13, 23, 41, 0.72);

      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .message-wrap.user .message-bubble {
      background:
        linear-gradient(
          135deg,
          rgba(87, 217, 197, 0.12),
          rgba(54, 183, 170, 0.07)
        );

      border-color: rgba(87, 217, 197, 0.18);
    }

    .message-bubble a {
      color: #9be5dc;

      text-decoration: underline;
    }

    .message-bubble code {
      padding: 2px 6px;

      border-radius: 6px;

      background: rgba(255, 255, 255, 0.08);

      font-family: Consolas, Monaco, monospace;

      font-size: 12px;
    }

    .message-bubble pre {
      margin-top: 12px;

      overflow-x: auto;

      padding: 13px;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.30);

      border: 1px solid rgba(255, 255, 255, 0.07);

      font-family: Consolas, Monaco, monospace;

      font-size: 12px;

      line-height: 1.6;

      white-space: pre;
    }

    .message-actions {
      display: flex;

      gap: 6px;

      margin-top: 7px;

      opacity: 0;

      transition: 0.2s ease;
    }

    .message-wrap:hover .message-actions {
      opacity: 1;
    }

    .message-action {
      min-width: 29px;

      height: 28px;

      padding: 0 8px;

      border-radius: 8px;

      color: var(--text-muted);

      background: transparent;

      border: 1px solid transparent;

      cursor: pointer;
    }

    .message-action:hover {
      color: #fff;

      outline: 1px solid rgba(87, 217, 197, 0.26);

      outline-offset: -1px;
    }

    /* =========================
       COMPOSER
    ========================== */

    .composer-area {
      position: relative;

      padding: 8px 20px 18px;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 8, 16, 0),
          rgba(5, 8, 16, 0.72) 28%,
          rgba(5, 8, 16, 0.95)
        );
    }

    .composer {
      width: min(900px, 100%);

      margin: 0 auto;
    }

    .composer-box {
      display: flex;

      align-items: flex-end;

      gap: 8px;

      padding: 9px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.025)
        );

      border: 1px solid rgba(255, 255, 255, 0.10);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.30),
        0 0 30px rgba(87, 217, 197, 0.03);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .composer-box:focus-within {
      border-color: rgba(87, 217, 197, 0.30);

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.36),
        0 0 38px rgba(87, 217, 197, 0.08);
    }

    textarea {
      flex: 1;

      min-height: 46px;

      max-height: 180px;

      resize: none;

      border: 0;

      outline: 0;

      color: var(--text);

      background: transparent;

      padding: 12px 10px;

      line-height: 1.55;

      font-size: 14px;
    }

    textarea::placeholder {
      color: #65738a;
    }

    .composer-actions {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .composer-button {
      width: 42px;

      height: 42px;

      border-radius: 13px;

      display: grid;

      place-items: center;

      cursor: pointer;

      color: var(--text-soft);

      background: rgba(255, 255, 255, 0.045);

      border: 1px solid rgba(255, 255, 255, 0.05);

      transition:
        transform 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .composer-button:hover {
      transform: translateY(-2px) scale(1.03);

      color: #fff;

      outline: 1px solid rgba(87, 217, 197, 0.32);

      outline-offset: -1px;
    }

    .send-button {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          rgba(87, 217, 197, 0.28),
          rgba(54, 183, 170, 0.22)
        );

      border-color: rgba(87, 217, 197, 0.30);
    }

    .send-button:disabled,
    .composer-button:disabled {
      opacity: 0.45;

      cursor: not-allowed;

      transform: none;
    }

    .composer-hint {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 7px 4px 0;

      color: var(--text-muted);

      font-size: 10px;
    }

    /* =========================
       OVERLAY
    ========================== */

    .overlay {
      position: fixed;

      inset: 0;

      display: none;

      background: rgba(0, 0, 0, 0.54);

      z-index: 15;
    }

    .overlay.show {
      display: block;
    }

    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 24px;

      transform: translate(-50%, 20px);

      opacity: 0;

      max-width: min(92vw, 520px);

      padding: 11px 14px;

      border-radius: 12px;

      background: rgba(8, 14, 25, 0.94);

      border: 1px solid rgba(87, 217, 197, 0.22);

      box-shadow: var(--shadow);

      color: var(--text);

      font-size: 12px;

      pointer-events: none;

      transition: 0.25s ease;

      z-index: 50;
    }

    .toast.show {
      opacity: 1;

      transform: translate(-50%, 0);
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;

        inset: 0 auto 0 0;

        width: 285px;

        transform: translateX(-105%);

        transition: transform 0.25s ease;

        box-shadow: 20px 0 60px rgba(0, 0, 0, 0.28);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: grid;

        place-items: center;

        width: 38px;

        height: 38px;

        border-radius: 10px;

        background: rgba(255, 255, 255, 0.04);

        color: #fff;

        cursor: pointer;
      }

      .topbar {
        padding: 0 14px;
      }

      .messages {
        padding-left: 14px;

        padding-right: 14px;
      }
    }

    @media (max-width: 640px) {
      .topbar-badge {
        display: none;
      }

      .composer-area {
        padding: 8px 10px 13px;
      }

      .composer-hint {
        padding-inline: 2px;
      }

      .message-content {
        max-width: calc(100% - 44px);
      }

      .avatar {
        width: 31px;

        height: 31px;
      }

      .message-bubble {
        font-size: 13px;
      }

      .welcome {
        margin-top: 4vh;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-logo">🐰</div>

        <div>
          <h1>Bunny AI</h1>
          <span>Your friendly AI assistant</span>
        </div>
      </div>

      <button
        class="new-chat"
        id="newChatBtn"
        type="button"
      >
        <span>＋</span>
        <span>New Chat</span>
      </button>

      <div class="sidebar-title">
        Recent Chats
      </div>

      <div
        class="chat-list"
        id="chatList"
      ></div>

      <div class="side-actions">

        <button
          class="side-button"
          id="clearBtn"
          type="button"
        >
          <span class="side-button-icon">🧹</span>
          <span>Clear Conversation</span>
        </button>

        <button
          class="side-button"
          id="memoryBtn"
          type="button"
        >
          <span class="side-button-icon">🧠</span>
          <span>Session Memory</span>
        </button>

        <button
          class="side-button"
          id="resetBtn"
          type="button"
        >
          <span class="side-button-icon">↻</span>
          <span>Reset Bunny Session</span>
        </button>

      </div>
    </aside>

    <div
      class="overlay"
      id="overlay"
    ></div>

    <main class="main">

      <header class="topbar">

        <div class="topbar-left">

          <button
            class="mobile-menu"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
          >
            ☰
          </button>

          <span class="status-dot"></span>

          <span class="topbar-title">
            Bunny is ready
          </span>

        </div>

        <span class="topbar-badge">
          Secure server-side AI
        </span>

      </header>

      <section
        class="messages"
        id="messages"
      >

        <div
          class="messages-inner"
          id="messagesInner"
        >

          <div
            class="welcome"
            id="welcome"
          >

            <div class="welcome-logo">
              🐰
            </div>

            <h2>
              Hello, I’m Bunny.
            </h2>

            <p>
              Ask me anything, solve calculations,
              use voice input, or try one of the
              quick commands below.
            </p>

            <div class="chips">

              <button
                class="chip"
                data-prompt="Hello Bunny"
              >
                Hello Bunny
              </button>

              <button
                class="chip"
                data-prompt="What is Python?"
              >
                What is Python?
              </button>

              <button
                class="chip"
                data-prompt="2 + 5 * 3"
              >
                Calculate 2 + 5 × 3
              </button>

              <button
                class="chip"
                data-prompt="convert binary 1010"
              >
                Convert binary 1010
              </button>

              <button
                class="chip"
                data-prompt="open youtube"
              >
                Open YouTube
              </button>

              <button
                class="chip"
                data-prompt="time"
              >
                What time is it?
              </button>

            </div>

          </div>

        </div>

      </section>

      <section class="composer-area">

        <div class="composer">

          <form
            class="composer-box"
            id="composerForm"
          >

            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="Message Bunny…"
              autocomplete="off"
            ></textarea>

            <div class="composer-actions">

              <button
                class="composer-button"
                id="voiceBtn"
                type="button"
                title="Voice input"
                aria-label="Voice input"
              >
                🎙️
              </button>

              <button
                class="composer-button send-button"
                id="sendBtn"
                type="submit"
                title="Send"
                aria-label="Send"
              >
                ➤
              </button>

            </div>

          </form>

          <div class="composer-hint">
            <span>
              Enter to send • Shift+Enter for new line
            </span>

            <span id="counter">
              0 / 4000
            </span>
          </div>

        </div>

      </section>

    </main>

  </div>

  <div
    class="toast"
    id="toast"
  ></div>

  <script>
    /*
      ============================================================
      BUNNY AI FRONTEND
      ============================================================

      IMPORTANT:
      There is NO Gemini API key in this file.

      The browser only talks to the FastAPI backend.

      Backend:
      https://bunny-ai-backend.onrender.com

      Gemini key stays inside Render environment variables:
      GEMINI_API_KEY
      ============================================================
    */

    const API_BASE_URL =
      "https://bunny-ai-backend.onrender.com";

    const CHAT_ENDPOINT =
      `${API_BASE_URL}/api/chat`;

    const CLEAR_ENDPOINT =
      `${API_BASE_URL}/api/session/clear`;

    const DELETE_ENDPOINT =
      `${API_BASE_URL}/api/session`;

    const MEMORY_ENDPOINT =
      `${API_BASE_URL}/api/session`;

    const state = {
      sessionId: createSessionId(),
      chats: [],
      sending: false,
      recognition: null
    };

    const el = {
      sidebar: document.getElementById("sidebar"),
      overlay: document.getElementById("overlay"),
      menuBtn: document.getElementById("menuBtn"),
      newChatBtn: document.getElementById("newChatBtn"),
      clearBtn: document.getElementById("clearBtn"),
      memoryBtn: document.getElementById("memoryBtn"),
      resetBtn: document.getElementById("resetBtn"),
      chatList: document.getElementById("chatList"),
      messages: document.getElementById("messages"),
      messagesInner: document.getElementById("messagesInner"),
      welcome: document.getElementById("welcome"),
      form: document.getElementById("composerForm"),
      input: document.getElementById("messageInput"),
      send: document.getElementById("sendBtn"),
      voice: document.getElementById("voiceBtn"),
      counter: document.getElementById("counter"),
      toast: document.getElementById("toast")
    };

    function createSessionId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return (
        "bunny-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatText(text) {
      let safe = escapeHtml(text);

      safe = safe.replace(
        /```([\s\S]*?)```/g,
        (_, code) => {
          return `<pre>${code.trim()}</pre>`;
        }
      );

      safe = safe.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );

      safe = safe.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );

      safe = safe.replace(
        /\n/g,
        "<br>"
      );

      return safe;
    }

    function showToast(message) {
      el.toast.textContent = message;

      el.toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer =
        setTimeout(
          () => {
            el.toast.classList.remove("show");
          },
          2800
        );
    }

    function openSidebar() {
      el.sidebar.classList.add("open");
      el.overlay.classList.add("show");
    }

    function closeSidebar() {
      el.sidebar.classList.remove("open");
      el.overlay.classList.remove("show");
    }

    function autoResize() {
      el.input.style.height = "auto";

      el.input.style.height =
        Math.min(
          el.input.scrollHeight,
          180
        ) + "px";

      el.counter.textContent =
        `${el.input.value.length} / 4000`;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        el.messages.scrollTop =
          el.messages.scrollHeight;
      });
    }

    function addMessage(
      role,
      text,
      meta = ""
    ) {
      el.welcome?.remove();

      const wrap =
        document.createElement("div");

      wrap.className =
        `message-wrap ${role}`;

      const avatar =
        role === "user"
          ? "👤"
          : "🐰";

      const label =
        role === "user"
          ? "You"
          : "Bunny";

      wrap.innerHTML = `
        ${
          role === "user"
            ? ""
            : `<div class="avatar">${avatar}</div>`
        }

        <div class="message-content">

          <div class="message-meta">
            ${label}
            ${
              meta
                ? ` • ${escapeHtml(meta)}`
                : ""
            }
          </div>

          <div class="message-bubble">
            ${formatText(text)}
          </div>

          ${
            role === "assistant"
              ? `
                <div class="message-actions">
                  <button
                    class="message-action copy-message"
                    type="button"
                  >
                    Copy
                  </button>
                </div>
              `
              : ""
          }

        </div>

        ${
          role === "user"
            ? `<div class="avatar">${avatar}</div>`
            : ""
        }
      `;

      el.messagesInner.appendChild(wrap);

      scrollToBottom();

      const copyButton =
        wrap.querySelector(".copy-message");

      if (copyButton) {
        copyButton.addEventListener(
          "click",
          async () => {
            const bubble =
              wrap.querySelector(
                ".message-bubble"
              );

            try {
              await navigator.clipboard.writeText(
                bubble.innerText
              );

              showToast(
                "Copied to clipboard"
              );
            } catch {
              showToast(
                "Copy failed"
              );
            }
          }
        );
      }

      return wrap;
    }

    function addTyping() {
      const wrap =
        document.createElement("div");

      wrap.className =
        "message-wrap assistant";

      wrap.id =
        "typingMessage";

      wrap.innerHTML = `
        <div class="avatar">
          🐰
        </div>

        <div class="message-content">

          <div class="message-meta">
            Bunny • typing…
          </div>

          <div class="message-bubble">
            •••
          </div>

        </div>
      `;

      el.messagesInner.appendChild(wrap);

      scrollToBottom();
    }

    function removeTyping() {
      document
        .getElementById("typingMessage")
        ?.remove();
    }

    function addOrUpdateChatPreview(
      message
    ) {
      const existing =
        state.chats.find(
          chat =>
            chat.id ===
            state.sessionId
        );

      const title =
        message
          .trim()
          .slice(0, 34) ||
        "New Chat";

      if (existing) {
        existing.title = title;
      } else {
        state.chats.unshift({
          id: state.sessionId,
          title
        });
      }

      state.chats =
        state.chats.slice(0, 20);

      renderChatList();
    }

    function renderChatList() {
      el.chatList.innerHTML = "";

      if (!state.chats.length) {
        el.chatList.innerHTML = `
          <div
            style="
              color:var(--text-muted);
              font-size:11px;
              padding:10px 6px;
            "
          >
            No recent chats yet.
          </div>
        `;

        return;
      }

      for (const chat of state.chats) {
        const item =
          document.createElement("button");

        item.type = "button";

        item.className =
          `chat-item ${
            chat.id === state.sessionId
              ? "active"
              : ""
          }`;

        item.innerHTML = `
          <span class="chat-icon">
            💬
          </span>

          <span class="chat-title">
            ${escapeHtml(chat.title)}
          </span>
        `;

        item.addEventListener(
          "click",
          () => {
            if (
              chat.id ===
              state.sessionId
            ) {
              return;
            }

            state.sessionId =
              chat.id;

            resetChatUI(
              false
            );

            showToast(
              "Chat selected"
            );

            closeSidebar();

            renderChatList();
          }
        );

        el.chatList.appendChild(item);
      }
    }

    async function sendMessage(
      message
    ) {
      const text =
        message.trim();

      if (
        !text ||
        state.sending
      ) {
        return;
      }

      state.sending = true;

      el.send.disabled = true;

      el.voice.disabled = true;

      el.input.value = "";

      autoResize();

      addMessage(
        "user",
        text
      );

      addOrUpdateChatPreview(
        text
      );

      addTyping();

      try {
        const response =
          await fetch(
            CHAT_ENDPOINT,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text,

                session_id:
                  state.sessionId

                /*
                  IMPORTANT:
                  api_key is NOT sent.
                */
              })
            }
          );

        let data = null;

        try {
          data =
            await response.json();
        } catch {
          throw new Error(
            "Backend returned a non-JSON response."
          );
        }

        if (!response.ok) {
          const detail =
            data?.detail ||
            data?.message ||
            `HTTP ${response.status}`;

          throw new Error(
            detail
          );
        }

        const reply =
          data?.reply ??
          data?.response ??
          data?.message ??
          "Bunny returned an empty response.";

        removeTyping();

        addMessage(
          "assistant",
          String(reply)
        );

        if (data?.session_id) {
          state.sessionId =
            data.session_id;

          renderChatList();
        }

        await handleAction(
          data?.action
        );

      } catch (error) {
        removeTyping();

        const errorMessage =
          error?.message ||
          "Something went wrong.";

        addMessage(
          "assistant",
          "Sorry, I couldn't complete that request.\n\n" +
          errorMessage
        );

        console.error(
          "Bunny request error:",
          error
        );
      } finally {
        state.sending = false;

        el.send.disabled = false;

        el.voice.disabled = false;

        el.input.focus();
      }
    }

    async function handleAction(
      action
    ) {
      if (!action) {
        return;
      }

      let url = null;

      if (
        typeof action === "string" &&
        /^https?:\/\//i.test(action)
      ) {
        url = action;
      }

      if (
        typeof action === "object"
      ) {
        url =
          action.url ||
          action.href ||
          action.link ||
          action.target ||
          null;
      }

      if (
        url &&
        /^https?:\/\//i.test(url)
      ) {
        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

        return;
      }

      if (
        typeof action === "object" &&
        typeof action.value === "string" &&
        /^https?:\/\//i.test(action.value)
      ) {
        window.open(
          action.value,
          "_blank",
          "noopener,noreferrer"
        );
      }
    }

    async function clearConversation() {
      try {
        const response =
          await fetch(
            CLEAR_ENDPOINT,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                session_id:
                  state.sessionId
              })
            }
          );

        const data =
          await response.json()
            .catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data?.detail ||
            `HTTP ${response.status}`
          );
        }

        resetChatUI();

        showToast(
          "Conversation cleared"
        );

      } catch (error) {
        showToast(
          `Could not clear conversation: ${error.message}`
        );
      }
    }

    async function resetSession() {
      const oldSession =
        state.sessionId;

      try {
        const response =
          await fetch(
            DELETE_ENDPOINT,
            {
              method: "DELETE",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                session_id:
                  oldSession
              })
            }
          );

        const data =
          await response.json()
            .catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data?.detail ||
            `HTTP ${response.status}`
          );
        }

      } catch (error) {
        showToast(
          `Could not reset server session: ${error.message}`
        );

        return;
      }

      state.chats =
        state.chats.filter(
          chat =>
            chat.id !==
            oldSession
        );

      state.sessionId =
        createSessionId();

      resetChatUI();

      renderChatList();

      showToast(
        "New Bunny session created"
      );
    }

    async function showMemory() {
      try {
        const response =
          await fetch(
            `${MEMORY_ENDPOINT}/${encodeURIComponent(
              state.sessionId
            )}/memory`
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.detail ||
            `HTTP ${response.status}`
          );
        }

        const memory =
          typeof data === "string"
            ? data
            : (
                data?.memory ||
                data?.summary ||
                "No saved memory yet."
              );

        addMessage(
          "assistant",
          `Session memory:\n\n${memory}`
        );

      } catch (error) {
        showToast(
          `Could not load memory: ${error.message}`
        );
      }
    }

    function resetChatUI(
      showToastAfter = true
    ) {
      el.messagesInner.innerHTML = `
        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            🐰
          </div>

          <h2>
            Hello, I’m Bunny.
          </h2>

          <p>
            Ask me anything, solve calculations,
            use voice input, or try one of the
            quick commands below.
          </p>

          <div class="chips">

            <button
              class="chip"
              data-prompt="Hello Bunny"
            >
              Hello Bunny
            </button>

            <button
              class="chip"
              data-prompt="What is Python?"
            >
              What is Python?
            </button>

            <button
              class="chip"
              data-prompt="2 + 5 * 3"
            >
              Calculate 2 + 5 × 3
            </button>

            <button
              class="chip"
              data-prompt="convert binary 1010"
            >
              Convert binary 1010
            </button>

            <button
              class="chip"
              data-prompt="open youtube"
            >
              Open YouTube
            </button>

            <button
              class="chip"
              data-prompt="time"
            >
              What time is it?
            </button>

          </div>

        </div>
      `;

      bindChips();

      if (showToastAfter) {
        showToast(
          "Chat cleared"
        );
      }
    }

    function newChat() {
      state.sessionId =
        createSessionId();

      resetChatUI(
        false
      );

      renderChatList();

      closeSidebar();

      showToast(
        "New chat started"
      );

      el.input.focus();
    }

    function bindChips() {
      document
        .querySelectorAll(
          ".chip[data-prompt]"
        )
        .forEach(chip => {
          chip.addEventListener(
            "click",
            () => {
              sendMessage(
                chip.dataset.prompt
              );
            }
          );
        });
    }

    function setupVoice() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        el.voice.addEventListener(
          "click",
          () => {
            showToast(
              "Voice input is not supported in this browser."
            );
          }
        );

        return;
      }

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "en-IN";

      recognition.interimResults =
        true;

      recognition.continuous =
        false;

      state.recognition =
        recognition;

      recognition.onstart =
        () => {
          el.voice.textContent =
            "🔴";

          showToast(
            "Listening…"
          );
        };

      recognition.onend =
        () => {
          el.voice.textContent =
            "🎙️";
        };

      recognition.onerror =
        event => {
          el.voice.textContent =
            "🎙️";

          showToast(
            `Voice input error: ${event.error}`
          );
        };

      recognition.onresult =
        event => {
          let finalText = "";

          for (
            let i =
              event.resultIndex;
            i <
              event.results.length;
            i++
          ) {
            if (
              event.results[i]
                .isFinal
            ) {
              finalText +=
                event.results[i][0]
                  .transcript;
            }
          }

          if (finalText) {
            el.input.value =
              `${el.input.value} ${finalText}`
                .trim();

            autoResize();
          }
        };

      el.voice.addEventListener(
        "click",
        () => {
          try {
            recognition.start();
          } catch {
            // Recognition may already be active.
          }
        }
      );
    }

    /* =========================
       EVENTS
    ========================== */

    el.form.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        sendMessage(
          el.input.value
        );
      }
    );

    el.input.addEventListener(
      "input",
      autoResize
    );

    el.input.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          el.form.requestSubmit();
        }
      }
    );

    el.newChatBtn.addEventListener(
      "click",
      newChat
    );

    el.clearBtn.addEventListener(
      "click",
      clearConversation
    );

    el.memoryBtn.addEventListener(
      "click",
      showMemory
    );

    el.resetBtn.addEventListener(
      "click",
      resetSession
    );

    el.menuBtn.addEventListener(
      "click",
      openSidebar
    );

    el.overlay.addEventListener(
      "click",
      closeSidebar
    );

    bindChips();

    setupVoice();

    renderChatList();

    autoResize();

    el.input.focus();
  </script>
</body>
</html>
